# App Engine（スタンダード）設定。リポジトリのルートからデプロイする。
# 事前に frontend で `npm run build` して frontend/dist を作っておくこと。
runtime: python313
entrypoint: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT

instance_class: F2

# 保存先を Datastore に切り替えたので複数インスタンスでもデータは共有される。
# 課金が増えすぎないよう、念のため上限だけ設ける。
automatic_scaling:
  max_instances: 3

# 秘密情報は入れない（ここは値が公開されても問題ないものだけ）。
env_variables:
  GEMINI_BACKEND: "vertex"
  GOOGLE_CLOUD_PROJECT: "project-b136cb29-e39c-4cf1-a95"
  GOOGLE_CLOUD_LOCATION: "global"
  STORE_BACKEND: "datastore"
  AUTH_BACKEND: "firebase"
  FIREBASE_PROJECT_ID: "project-b136cb29-e39c-4cf1-a95"
  STORAGE_BUCKET: "project-b136cb29-e39c-4cf1-a95.appspot.com"
